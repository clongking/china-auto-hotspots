name: 抓取热点并发布到 GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每小时抓取一次（UTC），即北京时间每小时整点后 17 分
    - cron: "17 * * * *"
  workflow_dispatch:

# 静态产物推送到 gh-pages 分支，由 GitHub Pages（Source: gh-pages / root）托管。
# 这种方式不需要 Pages API 的管理权限，首次推送 gh-pages 分支会自动启用 Pages。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 抓取全部信源并生成数据快照
        env:
          SNAPSHOT_PREVIOUS_URL: https://${{ github.repository_owner }}.github.io${{ env.BASE_PATH }}/data/hotspots.json
        run: npm run snapshot

      - name: 静态导出（移除不支持静态导出的 API Route）
        env:
          NEXT_PUBLIC_STATIC_MODE: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
        run: |
          rm -rf src/app/api
          npx next build
          touch out/.nojekyll

      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: 静态导出 ${{ github.sha }}"
